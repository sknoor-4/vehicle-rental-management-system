<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title"><title id="title">Roadly friendly assistant</title><style>@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}@keyframes blink{0%,46%,52%,100%{transform:scaleY(1)}49%{transform:scaleY(.12)}}.bot{transform-origin:center;animation:bob 2.2s ease-in-out infinite}.eyes{transform-origin:center;animation:blink 4.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.bot,.eyes{animation:none}}</style><g class="bot"><path d="M32 9v6" stroke="#d8e3ff" stroke-linecap="round" stroke-width="3"/><circle cx="32" cy="7" r="4" fill="#f4c66e"/><rect x="9" y="17" width="46" height="39" rx="14" fill="#fff" stroke="#dce5f3" stroke-width="2"/><rect x="14" y="22" width="36" height="25" rx="9" fill="#eaf0ff"/><g class="eyes" fill="#263b63"><ellipse cx="25" cy="33" rx="2.8" ry="4"/><ellipse cx="39" cy="33" rx="2.8" ry="4"/></g><path d="M27 40q5 5 10 0" fill="none" stroke="#416ce2" stroke-linecap="round" stroke-width="2.4"/><circle cx="13" cy="36" r="3" fill="#f4c66e"/><circle cx="51" cy="36" r="3" fill="#f4c66e"/><path d="M21 57v3m22-3v3" stroke="#b8c8e8" stroke-linecap="round" stroke-width="3"/></g></svg>
